# Global Nginx HTTPS configuration for Dockerized Python apps
# Place this file where your Nginx main config includes it, or supply it
# as the server configuration for your reverse proxy container.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;

  # Timeouts (reasonable for web apps)
  client_body_timeout   10s;
  client_header_timeout 10s;
  keepalive_timeout     15s;
  send_timeout          10s;

  # Upload and header size limits to mitigate large-payload and header attacks
  client_max_body_size 20M;        # tune per-app
  client_body_buffer_size 128k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # Rate limiting and connection limiting zones (memory-backed)
  limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
  limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
  # Dedicated tighter zone for auth endpoints (configured in server template)
  limit_req_zone  $binary_remote_addr zone=req_limit_login:10m rate=1r/s;

  # Map suspicious user-agents to a flag (simple scanner blocking)
  map $http_user_agent $bad_ua {
    default 0;
    ~*(?:sqlmap|nikto|acunetix|masscan|nessus|dirbuster|fuzz|curl|wget|python-requests) 1;
  }

  # Map request URIs that indicate traversal or sensitive-file access
  map $request_uri $bad_uri {
    default 0;
    ~*(?:\.\./|/etc/passwd|/\.git/|\.env|wp-config\.php|/web\.config) 1;
  }

  # Simple blacklist by remote addr (optional, populate at runtime)
  geo $blocked_ip {
    default 0;
    # Example: 1.2.3.4/32 1;  # uncomment/populate as needed
  }

  # Upstream for dockerized python app (change service name/port as needed)
  upstream web_app {
    server web:8000;
    keepalive 16;
  }

  # Common log formats
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$request_time"';

  access_log /var/log/nginx/access.log main;

  # Include virtual host/server templates stored in a directory
  # You can include your app.https.conf.template here or from the main nginx.conf
  # include /etc/nginx/conf.d/*.conf;

  # Notes: keep this file's global settings minimal and import/enable the
  # per-domain template `app.https.conf.template` (below) as your server block.
}
