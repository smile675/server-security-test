worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 2048;
	use epoll;
}

http {
	include       mime.types;
	default_type  application/octet-stream;

	sendfile        on;
	tcp_nopush      on;
	tcp_nodelay     on;

	# Timeouts
	client_body_timeout   10s;
	client_header_timeout 10s;
	keepalive_timeout     15s;
	send_timeout          10s;

	# Limits to mitigate header injection / resource exhaustion
	client_max_body_size 20M;        # match proxy / upstream limits
	client_body_buffer_size 128k;
	client_header_buffer_size 4k;
	large_client_header_buffers 4 16k;

	# Connection / request rate limiting (zones kept in memory)
	limit_conn_zone $binary_remote_addr zone=addr:10m;
	limit_req_zone  $binary_remote_addr zone=req:10m rate=10r/s;

	# Login-specific rate limiting (tighter)
	limit_req_zone  $binary_remote_addr zone=login:10m rate=1r/s;

	# Basic mapping to block common scanner user-agents/headers
	map $http_user_agent $bad_ua {
		default 0;
		~*(?:sqlmap|nikto|acunetix|masscan|nessus|dirbuster|fuzz|curl) 1;
	}

	# Block suspicious request URIs that commonly indicate traversal or disclosure
	map $request_uri $bad_uri {
		default 0;
		~*(?:\.\./|/etc/passwd|/\.git/|\.env|wp-config\.php|/web\.config) 1;
	}

	# Recommended security headers (applied in server blocks)
	# Note: adjust Content-Security-Policy to match your application
	geo $limit_by_country {
		default 0;
	}

	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;

		# Redirect HTTP to HTTPS
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl http2 default_server;
		listen [::]:443 ssl http2 default_server;
		server_name _;

		# SSL / TLS configuration (prefer modern secure settings)
		ssl_certificate /etc/ssl/certs/ssl-cert.pem;
		ssl_certificate_key /etc/ssl/private/ssl-cert.key;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 1d;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;
		ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer-when-downgrade" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Content-Security-Policy "default-src 'self'; object-src 'none'" always;

		# Basic deny rules for scanners or traversal attempts
		if ($bad_ua) {
			return 403;
		}

		if ($bad_uri) {
			return 404;
		}

		# Global connection limits
		limit_conn addr 10;   # max 10 simultaneous connections per IP
		limit_req zone=req burst=20 nodelay;

		# Root / static hosting (tune as needed)
		root /var/www/html;
		index index.html;

		# Disallow access to sensitive files
		location ~* (?:\.env|\.git|wp-config\.php|config\.php|\.htaccess|web\.config)$ {
			deny all;
			access_log off;
			log_not_found off;
		}

		# Deny any attempts to traverse outside web root
		location ~* (?:\.*\./) {
			return 404;
		}

		# Protect common endpoints (login/auth) with stricter limits
		location ~* /(?:login|signin|auth|api/auth) {
			limit_req zone=login burst=5 nodelay;
			limit_conn addr 3;
			proxy_pass http://upstream_app;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_buffering on;
		}

		# General proxy rules for application endpoints
		location / {
			proxy_pass http://upstream_app;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Buffering and timeouts to protect upstream
			proxy_buffering on;
			proxy_buffers 8 16k;
			proxy_busy_buffers_size 32k;
			proxy_connect_timeout 5s;
			proxy_send_timeout 15s;
			proxy_read_timeout 30s;
		}

		# Return 405 for unexpected methods
		if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|OPTIONS)$) {
			return 405;
		}

		# Basic health endpoint
		location = /healthz {
			access_log off;
			return 200 'ok';
		}
	}

	# Upstream placeholder - configure to your backend
	upstream upstream_app {
		server 127.0.0.1:8000;
		keepalive 16;
	}

	# Notes:
	# - For production, install ModSecurity or a WAF for deeper inspection.
	# - Tune limit_req/limit_conn values according to traffic patterns.
	# - Ensure SSL cert paths and ciphers match your environment.
}

